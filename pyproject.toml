[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goban-style-qr"
version = "0.1.0"
description = "Generate stylized QR codes that resemble a Go board."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "swooboo" }]
dependencies = [
  "Flask>=3.1.3",
  "Pillow>=10.0.0",
  "qrcode>=7.4.2",
]

[project.optional-dependencies]
dev = ["opencv-python-headless>=4.12.0.88", "pytest>=8.0.0"]

[project.scripts]
goban-style-qr = "goban_style_qr.cli:main"
goban-style-qr-web = "goban_style_qr.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
